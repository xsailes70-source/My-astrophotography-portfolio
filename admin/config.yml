backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "portfolio"
    label: "Φωτογραφίες Portfolio"
    files:
      - name: "photos"
        label: "Οι φωτογραφίες μου"
        file: "content/photos.json"
        fields:
          - name: "photos"
            label: "Φωτογραφίες"
            widget: "list"
            summary: "{{fields.title_el}}"
            fields:
              - { name: "image", label: "Φωτογραφία", widget: "image", hint: "Ανέβασε το αντίγραφο JPG ή PNG στο αρχικό του μέγεθος. Η σελίδα το μετατρέπει αυτόματα σε ελαφριά WebP για τους επισκέπτες." }
              - name: "category"
                label: "Κατηγορία"
                widget: "select"
                options:
                  - { label: "Βαθύ Σύμπαν", value: "deepsky" }
                  - { label: "Ηλιακό Σύστημα", value: "solar" }
                  - { label: "Astro-landscape", value: "landscape" }
              - { name: "title_el", label: "Τίτλος στα ελληνικά", widget: "string" }
              - { name: "title_en", label: "Τίτλος στα αγγλικά (προαιρετικό)", widget: "string", required: false }
              - { name: "description_el", label: "Περιγραφή στα ελληνικά", widget: "text", required: false }
              - { name: "description_en", label: "Περιγραφή στα αγγλικά (προαιρετικό)", widget: "text", required: false }
              - { name: "target", label: "Στόχος / αντικείμενο", widget: "string", required: false }
              - { name: "location", label: "Τοποθεσία", widget: "string", required: false }
              - { name: "gear", label: "Εξοπλισμός", widget: "string", required: false }
              - { name: "capture_date", label: "Ημερομηνία λήψης", widget: "string", required: false, hint: "π.χ. 22 Ιουλίου 2026" }
              - { name: "exposure", label: "Έκθεση", widget: "string", required: false, hint: "π.χ. 30s × 120" }
              - { name: "iso", label: "ISO", widget: "string", required: false, hint: "π.χ. ISO 800" }
              - { name: "frames", label: "Frames / λήψεις", widget: "string", required: false, hint: "π.χ. 120 stacked frames" }
              - { name: "processing", label: "Επεξεργασία", widget: "string", required: false }
